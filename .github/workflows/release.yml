name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, bundled with current LTS releases.
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Check versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          pkg=$(node -p 'require("./package.json").version')
          toc=$(sed -n 's/^## Version://p' addon/Seer/Seer.toc | tr -d '[:space:]')
          [ "$pkg" = "$want" ] || { echo "::error::package.json is $pkg, tag is $GITHUB_REF_NAME"; exit 1; }
          case "$toc" in ""|"$want"|@project-version@) ;; *) echo "::error::Seer.toc is $toc, tag is $GITHUB_REF_NAME"; exit 1 ;; esac

      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: npm ci
      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  addon:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # No CF_API_TOKEN here: the packager can't put spaces in the CurseForge file name, so the next step uploads.
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          toc=addon/Seer/Seer.toc
          project=$(sed -n 's/^## X-Curse-Project-ID:[[:space:]]*//p' "$toc" | tr -d '\r')
          interface=$(sed -n 's/^## Interface:[[:space:]]*//p' "$toc" | tr -d '\r')
          game_version="$((interface / 10000)).$((interface / 100 % 100)).$((interface % 100))"
          version_id=$(curl -sSf -H "x-api-token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions |
            jq --arg v "$game_version" '[.[] | select(.gameVersionTypeID == 88568 and .name == $v) | .id][0]')
          [ "$version_id" != null ] || { echo "::error::CurseForge has no Forever version $game_version"; exit 1; }
          case "$GITHUB_REF_NAME" in v0.*) type=beta ;; *) type=release ;; esac
          jq -n --arg name "Seer ${GITHUB_REF_NAME#v}" --argjson gv "$version_id" --arg type "$type" \
            --arg log "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{displayName: $name, gameVersions: [$gv], releaseType: $type, changelog: $log, changelogType: "text"}' > metadata.json
          curl -sSf --retry 3 -H "x-api-token: $CF_API_TOKEN" \
            -F "metadata=<metadata.json" -F "file=@$(ls .release/*.zip)" \
            "https://wow.curseforge.com/api/projects/$project/upload-file"
