name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 24, lts/*]
        include:
          - { os: windows-latest, node: lts/* }
          - { os: macos-latest, node: lts/* }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Lua 5.1 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Install LuaJIT (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1
      - name: Build Lua 5.1 (Windows)
        if: runner.os == 'Windows'
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.1.5"
      - run: npm ci
      - run: npm test
        env:
          SEER_LUA: ${{ runner.os == 'Linux' && 'lua5.1' || runner.os == 'macOS' && 'luajit' || 'lua' }}
